<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>Eugene Work — рабочее пространство</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c23;--panel2:#20242d;--line:#303541;--text:#f0f2f6;--muted:#9ca5b5;--accent:#b7f36b;--accent2:#d7f8ae;--danger:#ff8f8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}aside{border-right:1px solid var(--line);padding:24px 16px;background:#14161b;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.logo{width:38px;height:38px;border-radius:13px;background:var(--accent);color:#151810;display:grid;place-items:center;font-weight:900;font-size:20px}.brand strong{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:var(--muted)}.workspace-label{font-size:11px;letter-spacing:1.6px;color:#70798a;padding:0 10px;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b6becc;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.nav .ico{width:22px;text-align:center;font-size:17px}.aside-bottom{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:8px;color:var(--accent2);font-size:12px;margin-bottom:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
main{min-width:0;padding:26px clamp(16px,3vw,44px) 48px}.topbar{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:32px}.crumb{font-size:13px;color:var(--muted)}.top-actions{display:flex;gap:10px;align-items:center}.search{width:min(330px,32vw);position:relative}.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--text)}.avatar{width:36px;height:36px;border-radius:50%;background:#333947;display:grid;place-items:center;font-weight:700}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 8px}.heading{font-size:clamp(27px,3vw,38px);line-height:1.15;letter-spacing:-1.2px;margin:0 0 10px}.subheading{color:var(--muted);margin:0 0 28px;max-width:720px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 14px}.section-head h2{font-size:17px;margin:0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 13px}.btn:hover{border-color:#687282}.btn.primary{background:var(--accent);border-color:var(--accent);color:#161a12;font-weight:700}.btn.ghost{background:transparent}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.hero{grid-column:span 8;min-height:210px;background:linear-gradient(135deg,#20272a,#191c23 65%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #6f8a59;border-radius:50%;right:-40px;top:30px;box-shadow:0 0 0 24px #b7f36b0a,0 0 0 48px #b7f36b08}.hero h2{font-size:25px;margin:0 0 8px;max-width:430px}.hero p{color:var(--muted);max-width:410px;margin:0 0 22px}.hero>*{position:relative;z-index:1}.stat-card{grid-column:span 4}.stat-number{font-size:35px;font-weight:700;letter-spacing:-1px;margin:18px 0 2px}.stat-label{color:var(--muted);font-size:13px}.quick{grid-column:span 3;display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:15px}.quick:hover{border-color:#687282;transform:translateY(-1px)}.quick-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#2b3039;font-size:20px}.quick strong{display:block}.quick small{color:var(--muted)}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#171a20;min-width:0}.item-icon{width:36px;height:36px;border-radius:10px;background:#282d36;display:grid;place-items:center;flex-shrink:0}.item-body{min-width:0;flex:1}.item-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{font-size:12px;color:var(--muted)}.empty{border:1px dashed #3a404c;border-radius:14px;padding:26px;text-align:center;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-body{padding:18px}.field{width:100%;background:#12151a;border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--text)}textarea.field{min-height:220px;resize:vertical}.editor-title{font-size:24px;font-weight:700;background:transparent;border:0;color:var(--text);width:100%;margin-bottom:14px}.editor-body{min-height:330px;outline:none;line-height:1.8}.editor-body:empty:before{content:attr(data-placeholder);color:#737d8c}.note-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.note-card{background:#20242b;border:1px solid var(--line);border-radius:13px;padding:15px;min-height:140px;cursor:pointer}.note-card:hover{border-color:#657080}.note-card h3{font-size:15px;margin:0 0 8px}.note-card p{font-size:13px;color:var(--muted);margin:0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.day{min-height:94px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}.day.today{background:#b7f36b12}.day-num{font-weight:700}.event-chip{margin-top:5px;padding:4px 5px;background:#303b28;border-radius:5px;color:#d7f8ae;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.table-wrap{overflow:auto}.sheet{border-collapse:collapse;width:100%;min-width:500px}.sheet th,.sheet td{border:1px solid var(--line);padding:0}.sheet th{background:#252a33;color:var(--muted);font-size:12px;padding:7px}.sheet input{width:100%;min-width:80px;border:0;background:transparent;color:var(--text);padding:10px}.slide-stage{background:#0e1014;border:1px solid var(--line);border-radius:15px;padding:clamp(20px,5vw,70px);min-height:330px;display:flex;flex-direction:column;justify-content:center}.slide-stage h2{font-size:clamp(26px,4vw,44px);line-height:1.15;margin:0 0 20px}.slide-stage p{font-size:clamp(15px,2vw,20px);color:#b5bdca;white-space:pre-wrap}.slide-count{color:var(--muted);font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.modal h2{margin:0 0 18px}.form-stack{display:grid;gap:12px}.form-stack label{font-size:12px;color:var(--muted);display:grid;gap:6px}.toast{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#171a12;border-radius:10px;padding:11px 15px;font-weight:700;z-index:20;box-shadow:0 8px 30px #0006}.mobile-menu{display:none}
@media(max-width:980px){.app{grid-template-columns:205px minmax(0,1fr)}.hero{grid-column:span 7}.stat-card{grid-column:span 5}.quick{grid-column:span 4}.note-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.app{display:block}aside{position:sticky;top:0;z-index:5;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.brand{padding:0}.logo{width:32px;height:32px}.workspace-label,.aside-bottom{display:none}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{white-space:nowrap;padding:8px 10px;font-size:13px}.nav .ico{width:auto}.nav button.active{box-shadow:inset 0 -2px var(--accent)}main{padding:20px 14px 36px}.topbar{margin-bottom:25px}.search{width:min(58vw,280px)}.crumb{display:none}.hero,.stat-card{grid-column:span 12}.quick{grid-column:span 6;padding:12px}.quick-icon{width:34px;height:34px}.note-grid{grid-template-columns:1fr}.day{min-height:74px;padding:5px}.event-chip{font-size:10px}.panel-body{padding:12px}.top-actions{gap:7px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">e</div><div><strong>Eugene Work</strong><small>единое пространство</small></div></div>
  <div class="workspace-label">Рабочий кабинет</div>
  <nav class="nav" id="nav">
    <button class="active" data-view="home"><span class="ico">⌂</span>Обзор</button>
    <button data-view="calendar"><span class="ico">▦</span>Календарь</button>
    <button data-view="notes"><span class="ico">✎</span>Заметки</button>
    <button data-view="docs"><span class="ico">▤</span>Документы</button>
    <button data-view="sheets"><span class="ico">▦</span>Таблицы</button>
    <button data-view="slides"><span class="ico">▧</span>Презентации</button>
    <button data-view="files"><span class="ico">▱</span>Файлы</button>
  </nav>
  <div class="aside-bottom"><div class="status"><span class="dot"></span>Локальный режим</div>Материалы сохраняются в этом браузере. Облачная синхронизация будет подключена отдельным серверным слоем.</div>
</aside>
<main>
  <div class="topbar"><div class="crumb">Eugene / <span id="crumb-current">Рабочее пространство</span></div><div class="top-actions"><div class="search"><input id="search" placeholder="⌕  Поиск по материалам…" aria-label="Поиск по материалам"></div><div class="avatar" title="Локальный профиль">Y</div></div></div>
  <div id="view"></div>
</main>
</div>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
(()=> {
'use strict';
const KEY='eugeneWork.workspace.v1';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=> 'ew_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const fresh=()=>({notes:[],docs:[],events:[],sheets:[],slides:[],activeDoc:null,activeNote:null,activeSheet:null,activeDeck:null});
let data;
try{data={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=fresh()}
let view='home',month=new Date().getMonth(),year=new Date().getFullYear(),slideIndex=0,searchTerm='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=()=>new Date().toISOString();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast('Не удалось сохранить: возможно, переполнено хранилище. Экспортируйте резервную копию.');return} }
function toast(s){const root=$('#toast-root');root.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>root.innerHTML='',2200)}
function fmtDate(s){if(!s)return '';try{return new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})}catch{return s}}
function allItems(){return [...data.notes.map(x=>({...x,type:'Заметка',icon:'✎'})),...data.docs.map(x=>({...x,type:'Документ',icon:'▤'})),...data.events.map(x=>({...x,type:'Событие',icon:'▦'})),...data.sheets.map(x=>({...x,type:'Таблица',icon:'▦'})),...data.slides.map(x=>({...x,type:'Презентация',icon:'▧'}))]}
function go(v){view=v;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function head(kicker,title,sub,action=''){return '<p class="eyebrow">'+kicker+'</p><h1 class="heading">'+title+'</h1><p class="subheading">'+sub+'</p>'+(action?'<div class="section-head">'+action+'</div>':'')}
function empty(title,desc,btn,fn){return '<div class="empty"><strong>'+title+'</strong><p>'+desc+'</p>'+(btn?'<button class="btn primary" data-action="'+fn+'">'+btn+'</button>':'')+'</div>'}
function itemRow(x,action){return '<div class="item" '+(action?'data-open="'+action+':'+esc(x.id)+'"':'')+'><div class="item-icon">'+(x.icon||'▤')+'</div><div class="item-body"><div class="item-title">'+esc(x.title||'Без названия')+'</div><div class="item-meta">'+esc(x.type||'Материал')+' · обновлено '+fmtDate((x.updatedAt||x.createdAt||today()).slice(0,10))+'</div></div></div>'}
function renderHome(){const recent=allItems().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,5);return head('Рабочее пространство','Всё для работы. В одном месте.','Ваши документы, идеи, планы и данные собраны в едином кабинете. Создавайте материалы и продолжайте с того места, где остановились.')+
'<div class="grid"><section class="card hero"><p class="eyebrow">EUGENE WORKSPACE</p><h2>Рабочий поток без лишних переключений</h2><p>Запишите идею, запланируйте задачу, подготовьте документ или соберите презентацию — всё начинается здесь.</p><button class="btn primary" data-action="create">＋ Создать материал</button></section><section class="card stat-card"><span class="muted">Ваше пространство</span><div class="stat-number">'+allItems().length+'</div><div class="stat-label">материалов сохранено локально</div><div style="margin-top:20px"><span class="status"><span class="dot"></span>Локальное сохранение включено</span></div></section>'+
'<button class="quick" data-action="new-note"><span class="quick-icon">✎</span><span><strong>Заметка</strong><small>Быстро записать</small></span></button><button class="quick" data-action="new-doc"><span class="quick-icon">▤</span><span><strong>Документ</strong><small>Написать текст</small></span></button><button class="quick" data-action="new-sheet"><span class="quick-icon">▦</span><span><strong>Таблица</strong><small>Работа с данными</small></span></button><button class="quick" data-action="new-slide"><span class="quick-icon">▧</span><span><strong>Презентация</strong><small>Собрать слайды</small></span></button></div><div class="section-head"><h2>Недавние материалы</h2><button class="btn ghost" data-view="files">Все материалы →</button></div><div class="list">'+(recent.length?recent.map(x=>itemRow(x)).join(''):empty('Здесь пока пусто','Создайте первый материал — он появится в этом списке.','Создать заметку','new-note'))+'</div>'+
'<div class="section-head"><h2>Следующие события</h2><button class="btn ghost" data-view="calendar">Открыть календарь →</button></div><div class="list">'+(data.events.filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(x=>itemRow({...x,type:'Событие',icon:'▦'})).join('')||'<div class="item"><div class="item-icon">▦</div><div class="item-body"><div class="item-title">Пока нет предстоящих событий</div><div class="item-meta">Добавьте встречу или напоминание в календарь</div></div><button class="btn" data-action="new-event">＋</button></div>')+'</div>'}
function renderNotes(){const arr=data.notes.filter(x=>!searchTerm||(x.title+' '+x.body).toLowerCase().includes(searchTerm));return head('Личная база знаний','Заметки','Фиксируйте идеи, решения и наблюдения. Заметки доступны в этом браузере и входят в резервную копию.', '<h2>Все заметки · '+arr.length+'</h2><button class="btn primary" data-action="new-note">＋ Новая заметка</button>')+(arr.length?'<div class="note-grid">'+arr.map(n=>'<article class="note-card" data-open="note:'+n.id+'"><h3>'+esc(n.title||'Без названия')+'</h3><p>'+esc(n.body||'Пустая заметка')+'</p><div class="item-meta" style="margin-top:12px">'+fmtDate((n.updatedAt||n.createdAt).slice(0,10))+'</div></article>').join('')+'</div>':empty('Нет заметок','Создайте первую заметку.','＋ Новая заметка','new-note'))}
function renderNoteEditor(n){return head('Заметки',n?'Редактирование заметки':'Новая заметка','Изменения сохраняются автоматически в локальном хранилище.')+'<div class="panel"><div class="panel-head"><button class="btn" data-view="notes">← К заметкам</button><div class="toolbar"><button class="btn" data-action="delete-note">Удалить</button><span class="item-meta" id="save-state">Автосохранение</span></div></div><div class="panel-body"><input class="editor-title" id="note-title" placeholder="Название заметки" value="'+esc(n?.title||'')+'"><textarea class="field" id="note-body" placeholder="Начните писать…">'+esc(n?.body||'')+'</textarea></div></div>'}
function renderDocs(){const arr=data.docs.filter(x=>!searchTerm||(x.title+' '+x.body).toLowerCase().includes(searchTerm));return head('Текстовый редактор','Документы','Черновики и текстовые материалы. Для сложной вёрстки и совместного редактирования позднее будет подключён полноценный редактор.', '<h2>Документы · '+arr.length+'</h2><button class="btn primary" data-action="new-doc">＋ Новый документ</button>')+(arr.length?'<div class="list">'+arr.map(x=>itemRow({...x,type:'Документ',icon:'▤'},'doc')).join('')+'</div>':empty('Документов пока нет','Создайте текстовый документ.','＋ Новый документ','new-doc'))}
function renderDocEditor(d){return head('Документы','Текстовый редактор','Простой редактор черновиков с автосохранением. Экспорт доступен через раздел «Файлы».')+'<div class="panel"><div class="panel-head"><button class="btn" data-view="docs">← К документам</button><div class="toolbar"><button class="btn" data-action="export-doc">Экспорт .txt</button><button class="btn" data-action="delete-doc">Удалить</button></div></div><div class="panel-body"><input class="editor-title" id="doc-title" placeholder="Название документа" value="'+esc(d?.title||'')+'"><div class="toolbar" style="margin-bottom:12px"><button class="btn" data-format="bold"><b>B</b></button><button class="btn" data-format="italic"><i>I</i></button><button class="btn" data-format="insertUnorderedList">• Список</button><span class="item-meta">Форматирование работает в пределах браузерного редактора</span></div><div id="doc-body" class="editor-body" contenteditable="true" data-placeholder="Начните писать документ…">'+(d?.body||'')+'</div></div></div>'}
function renderCalendar(){const first=new Date(year,month,1),start=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate();let cells='';for(let i=0;i<42;i++){let d=i-start+1,cur=d>0&&d<=days,day=cur?d:d<=0?prev+d:d-days,dt=cur?new Date(year,month,d):d<=0?new Date(year,month-1,day):new Date(year,month+1,day),iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),ev=data.events.filter(e=>e.date===iso);cells+='<div class="day '+(iso===today()?'today ':'')+(cur?'':'muted')+'"><div class="day-num">'+day+'</div>'+ev.map(e=>'<div class="event-chip" title="'+esc(e.title)+'">'+esc((e.time?e.time+' ':'')+e.title)+'</div>').join('')+'</div>'}const upcoming=data.events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return head('Планирование','Календарь','Собирайте встречи, сроки и личные планы рядом с документами и заметками.')+'<div class="panel"><div class="panel-body"><div class="calendar-head"><div class="toolbar"><button class="btn" data-action="month-prev">←</button><strong>'+new Date(year,month,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</strong><button class="btn" data-action="month-next">→</button></div><button class="btn primary" data-action="new-event">＋ Событие</button></div><div class="calendar-grid">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>'<div class="day muted" style="min-height:0;font-weight:700">'+d+'</div>').join('')+cells+'</div></div></div><div class="section-head"><h2>Предстоящие события</h2></div><div class="list">'+(upcoming.map(e=>itemRow({...e,title:fmtDate(e.date)+(e.time?' · '+e.time:'')+' — '+e.title,type:'Событие',icon:'▦'})).join('')||'<div class="empty">Предстоящих событий нет.</div>')+'</div>'}
function renderSheets(){const arr=data.sheets.filter(x=>!searchTerm||x.title.toLowerCase().includes(searchTerm));return head('Работа с данными','Таблицы','Лёгкая редактируемая сетка для списков, планов и расчётов. Импорт и экспорт CSV поддерживаются в этой версии.', '<h2>Таблицы · '+arr.length+'</h2><div class="toolbar"><button class="btn" data-action="import-csv">Импорт CSV</button><button class="btn primary" data-action="new-sheet">＋ Новая таблица</button></div>')+(arr.length?'<div class="list">'+arr.map(x=>itemRow({...x,type:'Таблица',icon:'▦'},'sheet')).join('')+'</div>':empty('Таблиц пока нет','Создайте таблицу или импортируйте CSV.','＋ Новая таблица','new-sheet'))}
function renderSheetEditor(s){let rows=s?.rows||[['Наименование','Количество','Статус'],['Пример','1','В работе'],['',' ','']];return head('Таблицы',s?.title||'Новая таблица','Нажмите на ячейку, чтобы изменить значение. Данные сохраняются автоматически.')+'<div class="panel"><div class="panel-head"><button class="btn" data-view="sheets">← К таблицам</button><div class="toolbar"><button class="btn" data-action="add-row">＋ Строка</button><button class="btn" data-action="add-col">＋ Столбец</button><button class="btn" data-action="export-csv">Экспорт CSV</button><button class="btn" data-action="delete-sheet">Удалить</button></div></div><div class="panel-body"><input class="field" id="sheet-title" style="margin-bottom:14px" value="'+esc(s?.title||'Новая таблица')+'" placeholder="Название таблицы"><div class="table-wrap"><table class="sheet" id="sheet-table"><thead><tr><th>#</th>'+rows[0].map((_,i)=>'<th>'+String.fromCharCode(65+i)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,ri)=>'<tr><th>'+(ri+1)+'</th>'+r.map((c,ci)=>'<td><input data-r="'+ri+'" data-c="'+ci+'" value="'+esc(c)+'" aria-label="Строка '+(ri+1)+', столбец '+(ci+1)+'"></td>').join('')+'</tr>').join('')+'</tbody></table></div></div></div>'}
function renderSlides(){const arr=data.slides.filter(x=>!searchTerm||x.title.toLowerCase().includes(searchTerm));return head('Визуальные истории','Презентации','Создавайте простые презентации, редактируйте слайды и запускайте режим показа. Для совместимости с PPTX позднее понадобится отдельный движок.', '<h2>Презентации · '+arr.length+'</h2><button class="btn primary" data-action="new-slide">＋ Новая презентация</button>')+(arr.length?'<div class="list">'+arr.map(x=>itemRow({...x,type:'Презентация',icon:'▧'},'deck')).join('')+'</div>':empty('Презентаций пока нет','Создайте презентацию и добавьте первый слайд.','＋ Новая презентация','new-slide'))}
function renderDeck(d){if(!d)return '';const s=d.slides[slideIndex]||d.slides[0]||{title:'Новый слайд',body:''};return head('Презентации','Редактор слайдов','Редактируйте заголовок и текст текущего слайда. Изменения сохраняются автоматически.')+'<div class="panel"><div class="panel-head"><button class="btn" data-view="slides">← К презентациям</button><div class="toolbar"><span class="slide-count">Слайд '+(slideIndex+1)+' из '+d.slides.length+'</span><button class="btn" data-action="prev-slide">←</button><button class="btn" data-action="next-slide">→</button><button class="btn" data-action="add-slide">＋ Слайд</button><button class="btn" data-action="present">▶ Показ</button><button class="btn" data-action="delete-deck">Удалить</button></div></div><div class="panel-body"><input class="field" id="deck-title" style="margin-bottom:14px" value="'+esc(d.title)+'" placeholder="Название презентации"><div class="slide-stage"><input id="slide-title" class="editor-title" value="'+esc(s.title)+'" placeholder="Заголовок слайда"><textarea id="slide-body" class="field" style="background:transparent;min-height:140px" placeholder="Основная мысль, тезисы, пояснения…">'+esc(s.body)+'</textarea></div></div></div>'}
function renderFiles(){const arr=allItems().filter(x=>!searchTerm||(x.title+' '+x.type).toLowerCase().includes(searchTerm)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));return head('Хранилище','Файлы и материалы','Единый список объектов рабочего кабинета. Экспортируйте резервную копию, чтобы перенести данные в другой браузер.', '<h2>Материалы · '+arr.length+'</h2><div class="toolbar"><button class="btn" data-action="import-backup">Импорт JSON</button><button class="btn primary" data-action="export-backup">Экспорт резервной копии</button></div>')+(arr.length?'<div class="list">'+arr.map(x=>itemRow(x)).join('')+'</div>':empty('Пространство пока пусто','Создайте документ, заметку, таблицу или презентацию.'))}
function render(){const root=$('#view');const current={home:'Рабочее пространство',calendar:'Календарь',notes:'Заметки',docs:'Документы',sheets:'Таблицы',slides:'Презентации',files:'Файлы'};$('#crumb-current').textContent=current[view]||'Редактор';if(view==='home')root.innerHTML=renderHome();else if(view==='calendar')root.innerHTML=renderCalendar();else if(view==='notes')root.innerHTML=data.activeNote?renderNoteEditor(data.notes.find(x=>x.id===data.activeNote)):renderNotes();else if(view==='docs')root.innerHTML=data.activeDoc?renderDocEditor(data.docs.find(x=>x.id===data.activeDoc)):renderDocs();else if(view==='sheets')root.innerHTML=data.activeSheet?renderSheetEditor(data.sheets.find(x=>x.id===data.activeSheet)):renderSheets();else if(view==='slides')root.innerHTML=data.activeDeck?renderDeck(data.slides.find(x=>x.id===data.activeDeck)):renderSlides();else root.innerHTML=renderFiles()}
function create(type){const now=stamp();if(type==='note'){const x={id:uid(),title:'',body:'',createdAt:now,updatedAt:now};data.notes.unshift(x);data.activeNote=x.id;go('notes');$('#note-title').focus()}else if(type==='doc'){const x={id:uid(),title:'Без названия',body:'',createdAt:now,updatedAt:now};data.docs.unshift(x);data.activeDoc=x.id;go('docs')}else if(type==='sheet'){const x={id:uid(),title:'Новая таблица',rows:[['Наименование','Количество','Статус'],['','1','В работе'],['','','']],createdAt:now,updatedAt:now};data.sheets.unshift(x);data.activeSheet=x.id;go('sheets')}else if(type==='slide'){const x={id:uid(),title:'Новая презентация',slides:[{title:'Заголовок презентации',body:'Ключевая мысль\n\nДобавьте тезисы и пояснения.'}],createdAt:now,updatedAt:now};data.slides.unshift(x);data.activeDeck=x.id;slideIndex=0;go('slides')}else if(type==='event')openEventModal();save()}
function openModal(title,fields,submitLabel,onSubmit){$('#modal-root').innerHTML='<div class="modal-backdrop" id="backdrop"><form class="modal" id="modal-form"><h2>'+title+'</h2><div class="form-stack">'+fields+'</div><div class="toolbar" style="justify-content:flex-end;margin-top:20px"><button type="button" class="btn" data-action="close-modal">Отмена</button><button class="btn primary" type="submit">'+submitLabel+'</button></div></form></div>';$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});$('#modal-form').addEventListener('submit',e=>{e.preventDefault();onSubmit(new FormData(e.target));closeModal()})}
function closeModal(){$('#modal-root').innerHTML=''}
function openEventModal(){openModal('Новое событие','<label>Название<input class="field" name="title" required placeholder="Например, планирование недели"></label><label>Дата<input class="field" type="date" name="date" required value="'+today()+'"></label><label>Время<input class="field" type="time" name="time" value="10:00"></label><label>Описание<textarea class="field" name="description" placeholder="Детали и заметки"></textarea></label>','Сохранить',f=>{const now=stamp();data.events.push({id:uid(),title:f.get('title'),date:f.get('date'),time:f.get('time'),description:f.get('description'),createdAt:now,updatedAt:now});save();render();toast('Событие сохранено')})}
function openPresent(){const d=data.slides.find(x=>x.id===data.activeDeck);if(!d)return;const s=d.slides[slideIndex];$('#modal-root').innerHTML='<div class="modal-backdrop"><div style="width:min(900px,100%);background:#101216;border:1px solid var(--line);border-radius:18px;padding:clamp(24px,6vw,70px);min-height:400px;display:flex;flex-direction:column;justify-content:center"><div class="slide-count">EUGENE WORK · '+(slideIndex+1)+' / '+d.slides.length+'</div><h1 style="font-size:clamp(32px,6vw,60px);line-height:1.1;margin:24px 0">'+esc(s.title)+'</h1><p style="font-size:clamp(18px,2.5vw,25px);color:#b8c0cc;white-space:pre-wrap">'+esc(s.body)+'</p><div class="toolbar" style="justify-content:flex-end;margin-top:40px"><button class="btn" data-action="present-prev">← Назад</button><button class="btn primary" data-action="present-next">Следующий →</button><button class="btn" data-action="close-modal">Закрыть</button></div></div></div>'}
function exportText(name,text,type='text/plain'){const blob=new Blob([text],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvEscape(v){v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){const s=data.sheets.find(x=>x.id===data.activeSheet);if(s)exportText((s.title||'table')+'.csv',s.rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv')}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}const width=Math.max(1,...rows.map(r=>r.length));return rows.map(r=>Array.from({length:width},(_,i)=>r[i]??''))}
function openImport(kind){const input=document.createElement('input');input.type='file';input.accept=kind==='csv'?'.csv,text/csv':'.json,application/json';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{if(kind==='csv'){const rows=parseCSV(String(reader.result));const now=stamp(),s={id:uid(),title:file.name.replace(/\.csv$/i,''),rows,createdAt:now,updatedAt:now};data.sheets.unshift(s);data.activeSheet=s.id;go('sheets');save();toast('CSV импортирован')}else{const obj=JSON.parse(String(reader.result));if(!obj||!Array.isArray(obj.notes)||!Array.isArray(obj.docs)||!Array.isArray(obj.events)||!Array.isArray(obj.sheets)||!Array.isArray(obj.slides))throw Error('bad schema');if(!confirm('Импорт объединит данные с текущим пространством. Продолжить?'))return;for(const k of ['notes','docs','events','sheets','slides'])data[k]=[...obj[k],...data[k]];save();go('files');toast('Резервная копия импортирована')}}catch(e){toast('Файл не удалось импортировать: проверьте формат')}};reader.readAsText(file)};input.click()}
function deleteCurrent(kind){if(!confirm('Удалить материал? Это действие нельзя отменить.'))return;const key={note:'notes',doc:'docs',sheet:'sheets',deck:'slides'}[kind],active={note:'activeNote',doc:'activeDoc',sheet:'activeSheet',deck:'activeDeck'}[kind];data[key]=data[key].filter(x=>x.id!==data[active]);data[active]=null;save();render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){if(view==='notes')saveNote();if(view==='docs')saveDoc();if(view==='sheets')saveSheet();if(view==='slides')saveDeck();go(b.dataset.view)}});
$('#search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();if(searchTerm&&view==='home')go('files');else render()});
function saveNote(){const n=data.notes.find(x=>x.id===data.activeNote);if(!n)return;n.title=$('#note-title')?.value||'';n.body=$('#note-body')?.value||'';n.updatedAt=stamp();save()}
function saveDoc(){const d=data.docs.find(x=>x.id===data.activeDoc);if(!d)return;d.title=$('#doc-title')?.value||'Без названия';d.body=$('#doc-body')?.innerHTML||'';d.updatedAt=stamp();save()}
function saveSheet(){const s=data.sheets.find(x=>x.id===data.activeSheet);if(!s)return;s.title=$('#sheet-title')?.value||'Новая таблица';const table=$('#sheet-table');if(table)s.rows=Array.from(table.querySelectorAll('tbody tr')).map(tr=>Array.from(tr.querySelectorAll('input')).map(i=>i.value));s.updatedAt=stamp();save()}
function saveDeck(){const d=data.slides.find(x=>x.id===data.activeDeck);if(!d)return;d.title=$('#deck-title')?.value||'Новая презентация';const s=d.slides[slideIndex];if(s){s.title=$('#slide-title')?.value||'';s.body=$('#slide-body')?.value||''}d.updatedAt=stamp();save()}
$('#view').addEventListener('input',e=>{if(['note-title','note-body'].includes(e.target.id))saveNote();if(['doc-title','doc-body'].includes(e.target.id))saveDoc();if(['sheet-title'].includes(e.target.id)||e.target.closest('#sheet-table'))saveSheet();if(['deck-title','slide-title','slide-body'].includes(e.target.id))saveDeck()});
$('#view').addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){const [kind,id]=open.dataset.open.split(':');if(kind==='note'){data.activeNote=id;go('notes')}if(kind==='doc'){data.activeDoc=id;go('docs')}if(kind==='sheet'){data.activeSheet=id;go('sheets')}if(kind==='deck'){data.activeDeck=id;slideIndex=0;go('slides')}return}const vb=e.target.closest('[data-view]');if(vb){if(vb.dataset.view==='files')save();go(vb.dataset.view);return}const fmt=e.target.closest('[data-format]');if(fmt){document.execCommand(fmt.dataset.format,false,null);$('#doc-body')?.focus();saveDoc();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='create')openModal('Создать материал','<label>Тип материала<select class="field" name="type"><option value="note">Заметка</option><option value="doc">Документ</option><option value="sheet">Таблица</option><option value="slide">Презентация</option><option value="event">Событие календаря</option></select></label>','Продолжить',f=>create(f.get('type')));
else if(a==='new-note')create('note');else if(a==='new-doc')create('doc');else if(a==='new-sheet')create('sheet');else if(a==='new-slide')create('slide');else if(a==='new-event')openEventModal();
else if(a==='close-modal')closeModal();else if(a==='delete-note')deleteCurrent('note');else if(a==='delete-doc')deleteCurrent('doc');else if(a==='delete-sheet')deleteCurrent('sheet');else if(a==='delete-deck')deleteCurrent('deck');
else if(a==='month-prev'){month--;if(month<0){month=11;year--}render()}else if(a==='month-next'){month++;if(month>11){month=0;year++}render()}
else if(a==='add-row'){saveSheet();const s=data.sheets.find(x=>x.id===data.activeSheet);s.rows.push(Array(s.rows[0]?.length||3).fill(''));save();render()}
else if(a==='add-col'){saveSheet();const s=data.sheets.find(x=>x.id===data.activeSheet);s.rows.forEach(r=>r.push(''));save();render()}
else if(a==='export-csv'){saveSheet();exportCSV()}
else if(a==='import-csv')openImport('csv')
else if(a==='export-backup'){exportText('eugene-work-backup-'+today()+'.json',JSON.stringify({...data,exportedAt:stamp(),format:'eugene-work-backup-v1'},null,2),'application/json');toast('Резервная копия подготовлена')}
else if(a==='import-backup')openImport('json')
else if(a==='export-doc'){saveDoc();const d=data.docs.find(x=>x.id===data.activeDoc);if(d)exportText((d.title||'document')+'.txt',d.body.replace(/<[^>]*>/g,'\n').replace(/&nbsp;/g,' '))}
else if(a==='prev-slide'){saveDeck();slideIndex=Math.max(0,slideIndex-1);render()}else if(a==='next-slide'){saveDeck();const d=data.slides.find(x=>x.id===data.activeDeck);slideIndex=Math.min(d.slides.length-1,slideIndex+1);render()}
else if(a==='add-slide'){saveDeck();const d=data.slides.find(x=>x.id===data.activeDeck);d.slides.push({title:'Новый слайд',body:''});slideIndex=d.slides.length-1;save();render()}
else if(a==='present'){saveDeck();openPresent()}
else if(a==='present-prev'||a==='present-next'){const d=data.slides.find(x=>x.id===data.activeDeck);slideIndex=Math.max(0,Math.min(d.slides.length-1,slideIndex+(a==='present-next'?1:-1)));openPresent()}
});
window.addEventListener('beforeunload',()=>{if(view==='notes')saveNote();if(view==='docs')saveDoc();if(view==='sheets')saveSheet();if(view==='slides')saveDeck()});
render();
})();
</script>
</body>
</html>
